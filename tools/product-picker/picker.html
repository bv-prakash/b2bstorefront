<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products</title>
    <link rel="stylesheet" href="picker.css">
  </head>
  <body>
    <main class="picker">
      <section class="picker-categories">
        <p id="category-filter-label" class="category-filter-title">Product by category</p>
        <div class="category-tools">
          <button type="button" id="category-collapse">Collapse all</button>
          <span class="category-tools-sep" aria-hidden="true">|</span>
          <button type="button" id="category-expand">Expand all</button>
        </div>
        <div id="category-filter" class="category-tree" aria-labelledby="category-filter-label"></div>
      </section>
      <section class="picker-products">
        <form class="picker-search" role="search">
          <label for="product-search">Search by SKU</label>
          <input id="product-search" type="search" placeholder="SKU or name" autocomplete="off">
        </form>
        <p id="picker-status" class="picker-status" role="status" hidden></p>
        <ul id="product-list" class="product-list"></ul>
      </section>
    </main>
    <script type="module" src="picker.js"></script>
  </body>
</html>
